<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jason Yu — Computer Engineering student at Cal Poly San Luis Obispo. Embedded systems, firmware, software, and ways to get in touch." />
    <meta name="theme-color" content="#21221f" />
    <title>My Website</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const saved = localStorage.getItem('personal-site-theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view this personal website.</noscript>
  </body>
</html>
